<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Login - DWWD</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>DWWD</h1>
    <p class="muted">A Discord-inspired chat app</p>
    <form id="loginForm">
      <input name="username" placeholder="Username" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Sign in</button>
    </form>
    <p class="muted">No account? <a href="/register.html">Register</a></p>
    <div id="err" class="error"></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = { username: form.username.value, password: form.password.value };
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      });
      const j = await res.json();
      if (!res.ok) {
        document.getElementById('err').textContent = j.error || 'Login failed';
        return;
      }
      // store token in localStorage for socket auth
      if (j.socketToken) localStorage.setItem('socketToken', j.socketToken);
      window.location.href = '/';
    });
  </script>
</body>
</html>
