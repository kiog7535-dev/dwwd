<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Register - DWWD</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Create account</h1>
    <form id="registerForm">
      <input name="username" placeholder="Username" required />
      <input name="displayName" placeholder="Display name (optional)" />
      <input name="password" type="password" placeholder="Password" required />
      <textarea name="bio" placeholder="Bio (optional)"></textarea>
      <button type="submit">Register</button>
    </form>
    <p class="muted">Have an account? <a href="/login.html">Login</a></p>
    <div id="err" class="error"></div>
  </div>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const body = { username: f.username.value, displayName: f.displayName.value, password: f.password.value, bio: f.bio.value };
      const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await res.json();
      if (!res.ok) {
        document.getElementById('err').textContent = j.error || 'Registration failed';
        return;
      }
      if (j.user && j.user.socketToken) localStorage.setItem('socketToken', j.user.socketToken);
      window.location.href = '/';
    });
  </script>
</body>
</html>
